<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3f8ff">
  <title>গণিত বন্ধু</title>

  <!-- JavaScript বন্ধ থাকলেও ৩ সেকেন্ড পরে পরের পেজে যাবে -->
  <noscript><meta http-equiv="refresh" content="3;url=index.html"></noscript>

  <script>
    try {
      if (localStorage.getItem('ganitBondhuTheme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1424');
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --dur: 3s;                       /* স্প্ল্যাশ কতক্ষণ থাকবে (নিচের স্ক্রিপ্টের DURATION-এর সঙ্গে মেলাতে হবে) */
      --ink: #0d3c8c;
      --muted: #5f7499;
      --brand: #1565d8;
      --track: #c9dffb;
      --deco: #bcd6f8;
      --bg1: #f6faff;
      --bg2: #eaf3ff;
      --blob: #dbeafe;
    }
    html.dark {
      --ink: #dbe8ff;
      --muted: #9db4d6;
      --brand: #3b82e0;
      --track: #1f3354;
      --deco: #2a4a7a;
      --bg1: #0b1424;
      --bg2: #0f1d34;
      --blob: #13244a;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: "Hind Siliguri", Inter, sans-serif;
      color: var(--ink);
      overflow: hidden;
    }

    .splash {
      position: relative; max-width: 520px; height: 100dvh; min-height: 560px; margin: 0 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 8vh) 24px calc(env(safe-area-inset-bottom) + 28px);
      overflow: hidden; isolation: isolate;
    }

    /* ---------- পেছনের ঢেউ ও সাজসজ্জা ---------- */
    .blob { position: absolute; z-index: -2; pointer-events: none; }
    .blob.tl { top: -40px; left: -60px; width: 70%; }
    .blob.br { bottom: -30px; right: -60px; width: 95%; }
    .deco { position: absolute; z-index: -1; color: var(--deco); pointer-events: none; opacity: 0;
      animation: fadeIn .9s ease-out .2s forwards, float 6s ease-in-out 1.1s infinite; }
    .pi { top: 11%; left: 9%; font: italic 700 78px/1 "Times New Roman", Times, serif; }
    .pyth { top: 36%; left: 5%; font: italic 500 30px/1 "Times New Roman", Times, serif; transform: rotate(-14deg); white-space: nowrap; }
    .tri { top: 10%; right: 5%; width: 26%; max-width: 130px; animation-delay: .35s, 1.3s; }
    .axes { top: 33%; right: 4%; width: 24%; max-width: 120px; animation-delay: .5s, 1.5s; }

    /* ---------- মাঝের অংশ ---------- */
    .hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .app-icon {
      width: min(31vw, 150px); aspect-ratio: 1; border-radius: 26%;
      object-fit: cover; box-shadow: 0 18px 38px rgba(13, 60, 140, .32), 0 4px 10px rgba(13, 60, 140, .2);
      opacity: 0; transform: scale(.6);
      animation: pop .8s cubic-bezier(.2, 1.3, .4, 1) .1s forwards;
    }
    .title {
      margin: 6vh 0 0; font-weight: 700; font-size: clamp(44px, 14vw, 70px); line-height: 1.15; letter-spacing: -.5px;
      opacity: 0; transform: translateY(14px); animation: rise .7s ease-out .55s forwards;
    }
    .divider {
      display: flex; align-items: center; gap: 14px; width: min(86vw, 400px); margin-top: 2.2vh;
      opacity: 0; animation: fadeIn .6s ease-out .85s forwards;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1.5px; background: var(--muted); opacity: .55; }
    .divider svg { width: 46px; height: 32px; flex: none; }
    .sub {
      margin: 1.6vh 0 0; font: 500 clamp(21px, 6.4vw, 30px)/1.3 Inter, sans-serif; color: var(--muted);
      opacity: 0; transform: translateY(10px); animation: rise .7s ease-out 1s forwards;
    }
    .tag {
      margin: 1.2vh 0 0; font: italic 500 clamp(18px, 5.2vw, 24px)/1.3 Inter, sans-serif; color: var(--ink);
      opacity: 0; transform: translateY(10px); animation: rise .7s ease-out 1.2s forwards;
    }
    .tag b { font-weight: 500; margin: 0 .35em; }

    .books { width: min(88vw, 400px); margin-top: 1vh; opacity: 0; transform: translateY(24px);
      animation: rise .9s ease-out 1.1s forwards; }

    /* ---------- নিচের লোডিং বার ---------- */
    .loader { width: 100%; max-width: 360px; text-align: center; }
    .track { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
    .fill {
      height: 100%; width: 0; border-radius: 99px; background: var(--brand);
      animation: load var(--dur) cubic-bezier(.45, .05, .35, 1) forwards;
    }
    .loading { margin: 14px 0 0; font: 500 18px Inter, sans-serif; color: var(--ink); }
    .dots span { opacity: .25; animation: blink 1.2s infinite; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }

    @keyframes load { from { width: 0; } to { width: 100%; } }
    @keyframes pop { to { opacity: 1; transform: scale(1); } }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes float { 50% { translate: 0 -8px; } }
    @keyframes blink { 40% { opacity: 1; } }

    /* বের হওয়ার সময় ধীরে মিলিয়ে যায় */
    body.leaving .splash { opacity: 0; transition: opacity .35s ease; }

    @media (prefers-reduced-motion: reduce) {
      .deco { animation: fadeIn .01s forwards; }
      .app-icon, .title, .divider, .sub, .tag, .books { animation-duration: .01s; animation-delay: 0s; }
    }
    @media (max-height: 640px) {
      .books { width: min(70vw, 300px); }
      .title { margin-top: 3vh; }
    }
  </style>
</head>

<body>
  <main class="splash" id="splash" aria-label="গণিত বন্ধু লোড হচ্ছে">

    <!-- পেছনের ঢেউ -->
    <svg class="blob tl" viewBox="0 0 300 180" aria-hidden="true"><path d="M0 0H300C270 40 220 40 170 70C120 100 90 150 0 170Z" fill="var(--blob)" opacity=".85"/></svg>
    <svg class="blob br" viewBox="0 0 400 220" aria-hidden="true"><path d="M400 20C330 40 300 90 220 120C150 146 60 150 0 220H400Z" fill="var(--blob)" opacity=".9"/></svg>

    <!-- গণিতের সাজসজ্জা -->
    <span class="deco pi" aria-hidden="true">π</span>
    <span class="deco pyth" aria-hidden="true">a<sup style="font-size:.6em">2</sup>+b<sup style="font-size:.6em">2</sup>=c<sup style="font-size:.6em">2</sup></span>
    <svg class="deco tri" viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true">
      <path d="M12 10V92H118Z" stroke-linejoin="round"/><path d="M12 76H28V92"/>
      <text x="0" y="52" font-size="20" fill="currentColor" stroke="none" font-style="italic" font-family="Times New Roman, serif">a</text>
      <text x="64" y="40" font-size="20" fill="currentColor" stroke="none" font-style="italic" font-family="Times New Roman, serif">c</text>
      <text x="60" y="108" font-size="20" fill="currentColor" stroke="none" font-style="italic" font-family="Times New Roman, serif">b</text>
    </svg>
    <svg class="deco axes" viewBox="0 0 120 130" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path d="M60 124V14M52 24L60 12L68 24"/><path d="M6 80H110M100 72L112 80L100 88"/>
      <text x="74" y="16" font-size="18" fill="currentColor" stroke="none" font-style="italic" font-family="Times New Roman, serif">y</text>
      <text x="108" y="104" font-size="18" fill="currentColor" stroke="none" font-style="italic" font-family="Times New Roman, serif">x</text>
    </svg>

    <!-- লোগো, নাম, ট্যাগলাইন -->
    <section class="hero">
      <img class="app-icon" src="https://www.appcreator24.com/srv/imgs/gen/4227302_icohome.png?ts=1792924059" alt="গণিত বন্ধু অ্যাপ আইকন">
      <h1 class="title">গণিত বন্ধু</h1>
      <div class="divider" aria-hidden="true">
        <svg viewBox="0 0 46 32"><path d="M23 3L2 12L23 21L44 12Z" fill="#1565d8"/><path d="M11 17V25C11 28 35 28 35 25V17L23 22Z" fill="#0f4aa8"/><path d="M38 14V26" stroke="#f5b82e" stroke-width="2.2" stroke-linecap="round"/><circle cx="38" cy="28" r="2.4" fill="#f5b82e"/></svg>
      </div>
      <p class="sub">WBBSE Math Solutions</p>
      <p class="tag">Learn<b>•</b>Practice<b>•</b>Excel</p>
    </section>

    <!-- বই, কলমদানি, কম্পাস -->
    <svg class="books" viewBox="0 0 420 250" aria-hidden="true">
      <defs>
        <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a7be8"/><stop offset="1" stop-color="#0f55c8"/></linearGradient>
        <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#f6a51a"/></linearGradient>
        <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#245aa8"/><stop offset="1" stop-color="#143c80"/></linearGradient>
      </defs>
      <!-- পাতা -->
      <g fill="#bcd6f8" opacity=".75">
        <ellipse cx="38" cy="82" rx="16" ry="34" transform="rotate(-28 38 82)"/><ellipse cx="68" cy="60" rx="13" ry="28" transform="rotate(18 68 60)"/>
        <ellipse cx="392" cy="110" rx="16" ry="32" transform="rotate(30 392 110)"/><ellipse cx="365" cy="84" rx="12" ry="26" transform="rotate(-14 365 84)"/>
      </g>
      <ellipse cx="215" cy="228" rx="190" ry="14" fill="#9cc2f4" opacity=".45"/>
      <g transform="rotate(-5 215 160)">
        <!-- নিচের বই -->
        <rect x="52" y="178" width="292" height="36" rx="9" fill="url(#gNavy)"/>
        <rect x="64" y="208" width="288" height="12" rx="5" fill="#f4f7fc"/>
        <path d="M74 214H340" stroke="#d3dcec" stroke-width="1.5"/>
        <!-- মাঝের বই -->
        <rect x="58" y="146" width="282" height="36" rx="9" fill="url(#gYellow)"/>
        <rect x="72" y="176" width="276" height="11" rx="5" fill="#fffaf0"/>
        <path d="M82 181.5H342" stroke="#ecd9ae" stroke-width="1.5"/>
        <!-- ওপরের বই -->
        <rect x="70" y="112" width="270" height="38" rx="9" fill="url(#gBlue)"/>
        <rect x="86" y="144" width="262" height="11" rx="5" fill="#f4f7fc"/>
        <path d="M96 149.5H346" stroke="#d3dcec" stroke-width="1.5"/>
        <text x="96" y="138" font-size="19" font-weight="600" fill="#fff" font-family="Inter, sans-serif" transform="rotate(4 96 138)">Mathematics</text>
      </g>
      <!-- কলমদানি -->
      <path d="M226 74H292L286 134Q285 138 280 138H238Q233 138 232 134Z" fill="#1d3358"/>
      <ellipse cx="259" cy="74" rx="33" ry="7" fill="#27426f"/>
      <path d="M246 76L238 32" stroke="#f5b82e" stroke-width="11" stroke-linecap="round"/><path d="M233 20L238 36L244 22Z" fill="#e8c9a0"/><path d="M235 25L238 36L241 26Z" fill="#33445f"/>
      <path d="M272 76L285 36" stroke="#1565d8" stroke-width="10" stroke-linecap="round"/><path d="M283 38L287 26" stroke="#0b3a8d" stroke-width="10" stroke-linecap="round"/>
      <!-- কম্পাস -->
      <g stroke="#1f5fc6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M362 30L324 190" stroke-width="9"/><path d="M362 30L398 196" stroke-width="9"/>
        <path d="M333 150L386 154" stroke-width="5"/>
      </g>
      <circle cx="362" cy="34" r="13" fill="#1f5fc6"/><circle cx="362" cy="34" r="5.5" fill="#dbe9ff"/>
      <rect x="355" y="8" width="14" height="14" rx="3" fill="#2d6fd6"/>
      <path d="M324 190L320 206" stroke="#0e2f6a" stroke-width="4" stroke-linecap="round"/><path d="M398 196L402 212" stroke="#0e2f6a" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <!-- লোডিং বার -->
    <div class="loader" role="status">
      <div class="track"><div class="fill"></div></div>
      <p class="loading">Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var NEXT = 'home.html';      // স্প্ল্যাশের পর যে পেজ খুলবে
      var DURATION = 5000;          // মিলিসেকেন্ডে (CSS-এর --dur এর সঙ্গে মিলিয়ে রাখুন)

      var done = false;
      function go() {
        if (done) return;
        done = true;
        document.body.classList.add('leaving');
        setTimeout(function () { window.location.replace(NEXT); }, 320);
      }

      // ৩ সেকেন্ড পূর্ণ হওয়ার ঠিক আগে মিলিয়ে যাওয়া শুরু হয়, তাই মোট সময় ≈ ৩ সেকেন্ড
      setTimeout(go, DURATION - 320);

      // ইচ্ছা হলে স্ক্রিনে ট্যাপ করে এড়িয়ে যাওয়া যায়
      document.getElementById('splash').addEventListener('click', go);
    })();
  </script>

</body>

</html>
